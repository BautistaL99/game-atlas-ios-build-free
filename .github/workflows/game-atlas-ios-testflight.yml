name: Game Atlas iOS V252 - TestFlight (optativo)

# Se ejecuta SOLAMENTE al pulsar Run workflow en GitHub.
# El repositorio es publico, pero NUNCA guarda certificados, claves ni IPA como artefactos.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version publica iOS (1.0 para corregir la actual; 1.1 para una actualizacion tras publicar)'
        required: true
        default: '1.0'
        type: string
      runner:
        description: 'Compilador macOS (Intel recomendado si Apple Silicon queda en cola)'
        required: true
        default: 'macos-26-intel'
        type: choice
        options:
          - macos-26-intel
          - macos-26

permissions:
  contents: read

concurrency:
  group: game-atlas-ios-testflight-upload
  cancel-in-progress: false

jobs:
  # Fail fast on free/low-cost Linux before reserving a macOS runner.
  # Catches JavaScript syntax and localization regressions without Apple secrets.
  validar-fuentes:
    name: Validar Game Atlas V252 (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar todas las pruebas antes de usar macOS
        working-directory: ios-v220
        run: |
          set -euo pipefail
          node --check scripts/qa-ios-v246-i18n.mjs
          node scripts/verify-ios.mjs
          node scripts/qa-ios-v249-regressions.mjs --ios
          node scripts/qa-ios-v250-live-map-billing.mjs www
          node scripts/qa-ios-v251-store-ui-and-route.mjs www
          node scripts/qa-ios-v252-store-prices.mjs www
          node scripts/qa-marker-switch.mjs
          node scripts/qa-ios-audit.mjs
          node scripts/qa-ranking-truth.mjs
          node scripts/qa-ios-v245-map-and-samples.mjs
          node scripts/qa-ios-v246-i18n.mjs

  enviar-testflight:
    needs: validar-fuentes
    # Usa un grupo de máquinas diferente para evitar la cola arm64 sin runner.
    # El usuario puede elegir Apple Silicon manualmente como alternativa.
    runs-on: ${{ inputs.runner == 'macos-26' && 'macos-26' || 'macos-26-intel' }}
    timeout-minutes: 75
    steps:
      - name: Obtener codigo iOS
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verificar entorno Xcode 26 y máquina macOS
        shell: bash
        run: |
          set -euo pipefail
          echo "Máquina asignada: $RUNNER_NAME"
          echo "Sistema macOS:"
          sw_vers -productVersion
          xcodebuild -version
          MAJOR="$(xcodebuild -version | awk '/^Xcode / {split($2,n,"."); print n[1]; exit}')"
          if [[ -z "$MAJOR" || "$MAJOR" -lt 26 ]]; then
            echo "::error::Capacitor 8 requiere Xcode 26 o superior. Cambiá el runner del workflow."
            exit 1
          fi

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar credenciales Apple guardadas como GitHub Secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Falta el secreto $key en Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Diagnosticar autenticacion Apple API sin mostrar credenciales
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'CHECKAPPLE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const encode = obj => Buffer.from(JSON.stringify(obj)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = [
            encode({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'}),
            encode({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+600,aud:'appstoreconnect-v1'})
          ].join('.');
          const signed = crypto.sign('sha256', Buffer.from(unsigned), {
            key: fs.readFileSync(process.env.ASC_KEY_PATH),
            dsaEncoding: 'ieee-p1363'
          }).toString('base64url');
          const token = unsigned + '.' + signed;
          async function test(name, endpoint) {
            let response;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                response = await fetch('https://api.appstoreconnect.apple.com/v1/' + endpoint, {
                  headers: {Authorization:'Bearer ' + token,Accept:'application/json'},
                  signal: AbortSignal.timeout(15000)
                });
              } catch (error) {
                if (attempt === 3) {
                  console.error('::error::Apple API no responde tras 3 intentos: ' + String(error?.name||'network error'));
                  process.exitCode = 1;
                  return false;
                }
                console.log('::warning::Apple API temporalmente inaccesible. Reintentando autenticacion...');
                await new Promise(resolve => setTimeout(resolve, attempt * 2000));
                continue;
              }
              if ([429,500,502,503,504].includes(response.status) && attempt < 3) {
                console.log('::warning::Apple API HTTP ' + response.status + '. Reintentando autenticacion (' + attempt + '/3)...');
                await new Promise(resolve => setTimeout(resolve, attempt * 2000));
                continue;
              }
              break;
            }
            console.log('Apple API ' + name + ': HTTP ' + response.status);
            if (!response.ok) {
              const problem = await response.json().catch(() => ({}));
              for (const issue of (Array.isArray(problem.errors) ? problem.errors.slice(0,2) : [])) {
                console.log('Detalle Apple: ' + String(issue.code||'') + ' / ' + String(issue.title||'').slice(0,120));
              }
            }
            if (response.status === 401) {
              console.error('::error::Apple rechazo la clave API (401). Verificar que sea Team Key activa y coincidan Key ID, Issuer ID y archivo .p8.');
              process.exitCode = 1;
            } else if (response.status === 403) {
              console.error('::error::La clave no tiene permisos para ' + name + ' (403). Revisar rol y acceso a Certificates, Identifiers & Profiles.');
              process.exitCode = 1;
            } else if (!response.ok) {
              console.error('::error::Apple API fallo en ' + name + ' (HTTP ' + response.status + ').');
              process.exitCode = 1;
            }
            return response.ok;
          }
          if (await test('autenticacion general', 'apps?limit=1')) {
            // Los tres endpoints auxiliares no son necesarios para firmar con el
            // certificado .p12 y el perfil de provisionamiento ya guardados.
            // Apple devolvio HTTP 500 en bundleIds el 17/11/2026 pese a
            // una autenticacion 200: no bloquear la compilacion por esa sonda.
            console.log('Autenticacion Apple OK. El perfil y certificado guardados se validaran en el siguiente paso.');
          }
          CHECKAPPLE

      - name: Validar fuentes y generar proyecto de iPhone
        env:
          APP_STORE_VERSION: ${{ inputs.version }}
        working-directory: ios-v220
        run: |
          set -euo pipefail
          node scripts/verify-ios.mjs
          node scripts/qa-marker-switch.mjs
          node scripts/qa-ios-audit.mjs
          node scripts/qa-ranking-truth.mjs
          node scripts/qa-ios-v245-map-and-samples.mjs
          node scripts/qa-ios-v246-i18n.mjs
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios-native.mjs
          node scripts/ci-version.mjs
          test -d ios/App/App.xcodeproj
          # Fail if Capacitor/Xcode does not contain the exact shared images and code from this commit.
          python3 - <<'PYCHECK'
          from pathlib import Path
          import hashlib
          src=Path('www')
          bundled=Path('ios/App/App/public')
          required=['index.html','app-v137.js','monetization-v250.js','assets/leonida-yanis-v17.webp','assets/leonida-landmarks-v216.json','icons/icon-512.png']
          for rel in required:
              s=src/rel
              d=bundled/rel
              if not s.is_file() or not d.is_file() or s.read_bytes()!=d.read_bytes():
                  raise SystemExit('Error: el proyecto iOS no incluye el mismo archivo que se probó: '+rel)
          print('PASS: iOS Capacitor public/ incluye JS, mapa e imágenes idénticos')
          PYCHECK
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Game Atlas' ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string Game Atlas' ios/App/App/Info.plist

      - name: Importar firma Apple guardada para futuras actualizaciones
        env:
          GA_DIST_P12_B64: ${{ secrets.GA_DIST_P12_B64 }}
          GA_DIST_P12_PASSWORD: ${{ secrets.GA_DIST_P12_PASSWORD }}
          GA_PROFILE_B64: ${{ secrets.GA_PROFILE_B64 }}
          GA_APPLE_TEAM_ID: ${{ secrets.GA_APPLE_TEAM_ID }}
        working-directory: ios-v220
        run: |
          set -euo pipefail
          node scripts/use-saved-signing.mjs

      - name: Compilar archivo iOS firmado por Apple
        working-directory: ios-v220
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GameAtlas.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$GA_APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$GA_PROFILE_NAME" archive

      - name: Generar IPA de App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PYEXPORT'
          import os, plistlib
          opts = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["GA_APPLE_TEAM_ID"],
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {"com.indie.viassistant": os.environ["GA_PROFILE_NAME"]},
              "manageAppVersionAndBuildNumber": False,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "GameAtlasExport.plist"), "wb") as out:
              plistlib.dump(opts, out)
          PYEXPORT
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GameAtlas.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/GameAtlasExport.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          test -n "$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Enviar IPA directamente a TestFlight (sin hacerla publica)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app --file "$IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "IPA enviada a App Store Connect. La compilacion aparecera en TestFlight cuando Apple termine de procesarla."

# No se usan upload-artifact, releases ni adjuntos publicos.
# La IPA firmada solo se envia a Apple desde el runner.
