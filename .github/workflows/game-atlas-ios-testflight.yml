name: Game Atlas V238 - iOS a TestFlight

# Se ejecuta SOLAMENTE al pulsar Run workflow en GitHub.
# El repositorio es publico, pero NUNCA guarda certificados, claves ni IPA como artefactos.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version publica iOS (1.0 para corregir la actual; 1.1 para una actualizacion tras publicar)'
        required: true
        default: '1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: game-atlas-ios-testflight-upload
  cancel-in-progress: false

jobs:
  enviar-testflight:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Obtener codigo iOS
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Comprobar credenciales Apple guardadas como GitHub Secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          set -euo pipefail
          for key in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Falta el secreto $key en Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Diagnosticar autenticacion Apple API sin mostrar credenciales
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'CHECKAPPLE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const encode = obj => Buffer.from(JSON.stringify(obj)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = [
            encode({alg:'ES256',kid:process.env.ASC_KEY_ID,typ:'JWT'}),
            encode({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+600,aud:'appstoreconnect-v1'})
          ].join('.');
          const signed = crypto.sign('sha256', Buffer.from(unsigned), {
            key: fs.readFileSync(process.env.ASC_KEY_PATH),
            dsaEncoding: 'ieee-p1363'
          }).toString('base64url');
          const token = unsigned + '.' + signed;
          async function test(name, endpoint) {
            const response = await fetch('https://api.appstoreconnect.apple.com/v1/' + endpoint, {
              headers: {Authorization:'Bearer ' + token,Accept:'application/json'}
            });
            console.log('Apple API ' + name + ': HTTP ' + response.status);
            if (!response.ok) {
              const problem = await response.json().catch(() => ({}));
              for (const issue of (Array.isArray(problem.errors) ? problem.errors.slice(0,2) : [])) {
                console.log('Detalle Apple: ' + String(issue.code||'') + ' / ' + String(issue.title||'').slice(0,120));
              }
            }
            if (response.status === 401) {
              console.error('::error::Apple rechazo la clave API (401). Verificar que sea Team Key activa y coincidan Key ID, Issuer ID y archivo .p8.');
              process.exitCode = 1;
            } else if (response.status === 403) {
              console.error('::error::La clave no tiene permisos para ' + name + ' (403). Revisar rol y acceso a Certificates, Identifiers & Profiles.');
              process.exitCode = 1;
            } else if (!response.ok) {
              console.error('::error::Apple API fallo en ' + name + ' (HTTP ' + response.status + ').');
              process.exitCode = 1;
            }
            return response.ok;
          }
          if (await test('autenticacion general', 'apps?limit=1')) {
            if (await test('bundle IDs', 'bundleIds?limit=1')) {
              await test('certificados de firma', 'certificates?limit=1');
              await test('perfiles de firma', 'profiles?limit=1');
            }
          }
          CHECKAPPLE

      - name: Validar fuentes y generar proyecto de iPhone
        env:
          APP_STORE_VERSION: ${{ inputs.version }}
        working-directory: ios-v220
        run: |
          set -euo pipefail
          node scripts/verify-ios.mjs
          node scripts/qa-marker-switch.mjs
          node scripts/qa-ios-audit.mjs
          node scripts/qa-ranking-truth.mjs
          node scripts/qa-ios-v245-map-and-samples.mjs
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios-native.mjs
          node scripts/ci-version.mjs
          test -d ios/App/App.xcodeproj
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Game Atlas' ios/App/App/Info.plist || \
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string Game Atlas' ios/App/App/Info.plist

      - name: Importar firma Apple guardada para futuras actualizaciones
        env:
          GA_DIST_P12_B64: ${{ secrets.GA_DIST_P12_B64 }}
          GA_DIST_P12_PASSWORD: ${{ secrets.GA_DIST_P12_PASSWORD }}
          GA_PROFILE_B64: ${{ secrets.GA_PROFILE_B64 }}
          GA_APPLE_TEAM_ID: ${{ secrets.GA_APPLE_TEAM_ID }}
        working-directory: ios-v220
        run: |
          set -euo pipefail
          node scripts/use-saved-signing.mjs

      - name: Compilar archivo iOS firmado por Apple
        working-directory: ios-v220
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GameAtlas.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$GA_APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$GA_PROFILE_NAME" archive

      - name: Generar IPA de App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PYEXPORT'
          import os, plistlib
          opts = {
              "method": "app-store-connect",
              "destination": "export",
              "signingStyle": "manual",
              "teamID": os.environ["GA_APPLE_TEAM_ID"],
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {"com.indie.viassistant": os.environ["GA_PROFILE_NAME"]},
              "manageAppVersionAndBuildNumber": False,
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "GameAtlasExport.plist"), "wb") as out:
              plistlib.dump(opts, out)
          PYEXPORT
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GameAtlas.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/GameAtlasExport.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          test -n "$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Enviar IPA directamente a TestFlight (sin hacerla publica)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app --file "$IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "IPA enviada a App Store Connect. La compilacion aparecera en TestFlight cuando Apple termine de procesarla."

# No se usan upload-artifact, releases ni adjuntos publicos.
# La IPA firmada solo se envia a Apple desde el runner.
