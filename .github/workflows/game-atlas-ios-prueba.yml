name: Game Atlas V253 - Prueba iOS (optativa)

# Se ejecuta SOLO cuando el propietario pulsa Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-atlas-ios-public-simulator
  cancel-in-progress: false

jobs:
  comprobar-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Descargar fuentes de este repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Comprobar macOS y Xcode
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          command -v pod

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Revisar los archivos originales de Game Atlas
        working-directory: ios-v220
        run: |
          node scripts/verify-ios.mjs
          node scripts/qa-ios-v249-regressions.mjs --ios
          node scripts/qa-ios-v250-live-map-billing.mjs www
          node scripts/qa-ios-v251-store-ui-and-route.mjs www
          node scripts/qa-ios-v252-store-prices.mjs www
          node scripts/qa-ios-v253-launch-controls.mjs www

      - name: Instalar Capacitor y crear proyecto nativo iOS
        working-directory: ios-v220
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          node scripts/configure-ios-native.mjs

      - name: Compilar para simulador de iPhone sin firma Apple
        working-directory: ios-v220
        run: |
          set -euo pipefail
          # Capacitor 8 crea App.xcodeproj y usa Swift Package Manager.
          # No requiere App.xcworkspace (solo presente en algunos proyectos con CocoaPods).
          test -d ios/App/App.xcodeproj
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/GameAtlasBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo 'OK: Game Atlas compila para el simulador de iPhone.'

# Esta etapa NO genera IPA, NO firma con Apple y NO sube artefactos públicos.
